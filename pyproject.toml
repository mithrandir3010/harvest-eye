[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harvest-eye"
version = "0.1.0"
description = "Mushroom harvest detection with YOLOv8 and projection guidance"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mithrandir3010" }]
keywords = ["mushroom", "detection", "yolo", "computer-vision", "harvest"]

dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "opencv-python>=4.8",
    "ultralytics>=8.3",
]

[project.scripts]
harvest-eye = "harvest_eye.pipeline.video_stream:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harvest_eye*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
ignore = ["E501"]
